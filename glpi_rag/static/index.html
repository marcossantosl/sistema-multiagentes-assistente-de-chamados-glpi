<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente de Chamados</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --tx:#1d2330; --mut:#626b7c; --bd:#dde1e8; --ac:#2457c5;
          --ok:#1f7a45; --warn:#9a5b00; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --card:#1d222b; --tx:#e6e9ef; --mut:#9aa3b2; --bd:#2f3642; --ac:#7ea2ff;
            --ok:#5fc68b; --warn:#e3a54a; --bad:#ff8a80; }
  }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--tx) }
  main { max-width:980px; margin:0 auto; padding:24px 16px 64px }
  h1 { font-size:22px; margin:0 0 4px } h2 { font-size:17px; margin:28px 0 10px }
  .mut { color:var(--mut); font-size:13px }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:16px; margin:10px 0 }
  form { display:grid; gap:10px }
  input, textarea, button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--bd);
                            border-radius:8px; padding:9px 11px; width:100% }
  textarea { min-height:110px; resize:vertical }
  button { background:var(--ac); color:#fff; border:0; cursor:pointer; font-weight:600; width:auto; padding:10px 18px }
  button:disabled { opacity:.6; cursor:wait }
  .linha { display:flex; gap:10px; flex-wrap:wrap; align-items:center }
  .linha > input { flex:0 0 160px }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid currentColor }
  .alta { color:var(--ok) } .media { color:var(--warn) } .baixa { color:var(--mut) } .rej { color:var(--bad) }
  ol { padding-left:20px; margin:8px 0 } a { color:var(--ac) }
  .sim { display:grid; grid-template-columns:auto 1fr; gap:4px 12px }
  details summary { cursor:pointer; color:var(--mut); font-size:13px }
  pre { white-space:pre-wrap; font:13px/1.45 ui-monospace,Consolas,monospace; margin:6px 0 0 }
  .erro { color:var(--bad) }
</style>
</head>
<body>
<main>
  <h1>Assistente de Chamados</h1>
  <div class="mut" id="status">Carregando…</div>

  <div class="card">
    <form id="f">
      <div class="linha">
        <input id="tid" type="number" min="1" placeholder="Nº do chamado">
        <span class="mut">ou descreva o problema:</span>
      </div>
      <input id="titulo" placeholder="Título">
      <textarea id="descricao" placeholder="Descrição do problema"></textarea>
      <div class="linha"><button id="btn">Buscar soluções</button><span class="mut" id="prog"></span></div>
    </form>
  </div>

  <div id="saida"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

fetch("/api/status").then(r => r.json()).then(s => {
  $("status").textContent = `${s.total} chamados indexados (${s.com_solucao} com solução) · ` +
    `última sincronização: ${s.ultima_sincronizacao || "nunca"} · modelo ${s.modelo}`;
});

$("f").onsubmit = async (e) => {
  e.preventDefault();
  const corpo = $("tid").value ? { ticket_id: +$("tid").value }
                               : { titulo: $("titulo").value, descricao: $("descricao").value };
  $("btn").disabled = true; $("prog").textContent = "Agentes trabalhando: triagem → busca → avaliação → solução → revisão…";
  $("saida").innerHTML = "";
  try {
    const r = await fetch("/api/sugestoes", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    render(d);
  } catch (err) {
    $("saida").innerHTML = `<div class="card erro">${esc(err.message)}</div>`;
  } finally { $("btn").disabled = false; $("prog").textContent = ""; }
};

function render(d) {
  const sol = d.solucoes.map((s, i) => `
    <div class="card">
      <div class="linha"><strong>${i + 1}. ${esc(s.titulo)}</strong>
        <span class="tag ${s.aprovada ? esc(s.confianca) : "rej"}">${s.aprovada ? "confiança " + esc(s.confianca) : "não aprovada pelo revisor"}</span></div>
      <div class="mut">Causa provável: ${esc(s.causa_provavel)}</div>
      <ol>${s.passos.map(p => `<li>${esc(p)}</li>`).join("")}</ol>
      <div class="mut">Baseado em: ${s.chamados_referencia.length ? s.chamados_referencia.map(id => `<a href="#sim-${id}">#${id}</a>`).join(", ") : "diagnóstico padrão"}
        ${s.observacao_revisor ? " · Revisor: " + esc(s.observacao_revisor) : ""}</div>
    </div>`).join("");
  const sim = d.chamados_semelhantes.map(c => `
    <div class="card" id="sim-${c.id}">
      <div class="linha"><a href="${esc(c.link)}" target="_blank" rel="noopener"><strong>#${c.id}</strong></a>
        <strong>${esc(c.titulo)}</strong><span class="tag">relevância ${c.relevancia}/10</span><span class="mut">${esc(c.status)} · ${esc(c.data_abertura)}</span></div>
      <div class="mut">${esc(c.motivo)}</div>
      ${c.solucao ? `<details><summary>Como foi resolvido</summary><pre>${esc(c.solucao)}</pre></details>` : ""}
    </div>`).join("") || `<div class="card mut">Nenhum chamado semelhante relevante encontrado.</div>`;
  const lista = (t, xs) => xs.length ? `<h2>${t}</h2><div class="card"><ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  $("saida").innerHTML = `
    <h2>Resumo</h2><div class="card">${esc(d.resumo)}<div class="mut" style="margin-top:6px">${esc(d.diagnostico)}</div></div>
    ${lista("Alertas", d.alertas)}
    <h2>Possíveis soluções</h2>${sol}
    ${lista("Perguntar ao usuário", d.perguntas_ao_usuario)}
    <h2>Chamados semelhantes</h2>${sim}
    <details class="card"><summary>Rastro dos agentes</summary><pre>${esc(JSON.stringify(d.rastro, null, 2))}</pre></details>`;
}
</script>
</body>
</html>
